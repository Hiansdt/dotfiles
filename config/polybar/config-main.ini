[global/wm]
margin-top    = 0
margin-bottom = 0
include-file = $HOME/.config/polybar/colors-arch-dark.ini
include-file = $HOME/.config/polybar/modules.ini

[bar/main]
width = 12%
height = 38
radius = 10
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
monitor = eDP-1

border-size  = 0

offset-y = 12px
offset-x = 1%

padding       = 2
module-margin = 1

font-0 = JetbrainsMono :style=Medium:size=11;2
font-1 = Symbols Nerd Font :size=13;2
font-2 = Sarasa Gothic J:size=12;2

modules-left    = i3
# modules-center  = time
# modules-right   = pulseaudio memory filesystem network battery

wm-restack = i3

cursor-click  = pointer
override-redirect = true

[settings]
screenchange-reload = true

